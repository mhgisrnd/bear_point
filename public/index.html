<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>지리산 반달곰 위치 분석</title>

  <link rel="stylesheet" href="vendor/ol/ol.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/panel.css" />
</head>
<body>

  <!-- 관측점 목록 패널 -->
  <section class="obs-sheet hidden" id="obs-sheet" aria-label="관측점 목록 패널">
    <div class="obs-sheet-header">
      <h2>관측점 목록</h2>
      <div class="obs-header-actions">
        <button class="analysis-btn" id="btn-analysis" type="button">위치분석</button>
        <button class="obs-panel-icon-btn" id="btn-obs-list-peek" type="button" aria-label="최소화" title="최소화"><img src="css/svg/peek-collapse-white.svg" alt="" aria-hidden="true" /></button>
        <button class="obs-sheet-close" id="btn-obs-list-close" type="button" aria-label="닫기">
          <img src="css/svg/close-white.svg" alt="" aria-hidden="true" />
        </button>
      </div>
    </div>

    <div class="obs-search-bar">
      <select class="obs-search-select" id="search-field">
        <option value="obs">관측점</option>
        <option value="bear">코드</option>
      </select>
      <input class="obs-search-input" id="search-query" type="text" placeholder="검색..." autocomplete="off" />
      <button class="obs-search-clear" id="btn-search-clear" type="button">초기화</button>
    </div>

    <div class="obs-list-status" id="obs-list-status" aria-live="polite" hidden>
      <div class="obs-list-status__meta">
        <span class="obs-list-status__count" id="obs-list-count">0건</span>
        <span class="sel-count-badge" id="obs-selected-count" hidden>0개 선택</span>
      </div>
      <div class="obs-list-status__actions">
        <button class="obs-inline-register-btn" id="btn-obs-add-inline" type="button">관측점 등록</button>
        <button class="bulk-delete-btn bulk-delete-btn--inline" id="btn-delete-selected" type="button">선택 삭제</button>
      </div>
    </div>

    <div class="obs-table-wrap">
      <table class="obs-table">
        <thead>
          <tr>
            <th class="col-chk"><input type="checkbox" id="chk-all" title="전체선택" /></th>
            <th>관측점</th>
            <th>코드</th>
            <th>담당자</th>
            <th>관리</th>
          </tr>
        </thead>
        <tbody id="obs-list-body"></tbody>
      </table>
    </div>
  </section>

  <!-- 관측점 등록 팝업 -->
  <div class="obs-register-popup hidden" id="register-box" aria-label="관측점 등록 팝업">
    <div class="obs-register-header">
      <h2>관측점 등록</h2>
      <div class="obs-register-header-actions">
        <button class="obs-panel-icon-btn" id="btn-register-peek" type="button" aria-label="최소화" title="최소화"><img src="css/svg/peek-collapse-white.svg" alt="" aria-hidden="true" /></button>
        <button class="obs-register-close" id="btn-register-close" type="button" aria-label="닫기">
          <img src="css/svg/close-white.svg" alt="" aria-hidden="true" />
        </button>
      </div>
    </div>
    <div class="obs-register-body">
      <form class="obs-reg-form" id="obs-reg-form" autocomplete="off" onsubmit="return false;">

        <!-- 기본 정보 영역 -->
        <div class="obs-reg-section">

          <!-- 담당자 -->
          <div class="obs-reg-row">
            <label class="obs-reg-label" for="reg-owner">담당자</label>
            <input class="obs-reg-input" id="reg-owner" type="text" placeholder="담당자를 입력하세요" />
          </div>

          <!-- 명칭 -->
          <div class="obs-reg-row">
            <label class="obs-reg-label" for="reg-place">명칭</label>
            <input class="obs-reg-input" id="reg-place" type="text" placeholder="명칭을 입력하세요" />
          </div>

          <!-- 좌표 -->
          <div class="obs-reg-gps-toggle-row">
            <button class="obs-reg-gps-toggle" id="btn-gps-toggle" type="button" aria-pressed="false">
              <span class="obs-reg-gps-toggle__knob"></span>
              <span class="obs-reg-gps-toggle__label">GPS OFF</span>
            </button>
          </div>
          <div class="obs-reg-row">
            <label class="obs-reg-label">좌표</label>
            <input class="obs-reg-input obs-reg-input--gps" id="reg-coord" type="text" placeholder="GPS 대기중" readonly />
          </div>

          <!-- 방향각 -->
          <div class="obs-reg-row">
            <label class="obs-reg-label" for="reg-heading">방향각</label>
            <div class="obs-reg-heading-wrap">
              <input class="obs-reg-input obs-reg-input--gps obs-reg-input--heading" id="reg-heading" type="text" placeholder="현재 GPS 값" readonly />
              <label class="obs-reg-lock-label" for="chk-reg-heading-lock">
                <input id="chk-reg-heading-lock" type="checkbox" /> 각 고정
              </label>
            </div>
          </div>

          <!-- 곰 코드 -->
          <div class="obs-reg-row">
            <label class="obs-reg-label" for="reg-bear">곰 코드</label>
            <select class="obs-reg-select" id="reg-bear">
              <option value="">-- 선택 --</option>
            </select>
          </div>

        </div>

        <!-- 감지기 영역 -->
        <div class="obs-reg-section obs-reg-section--detector">
          <div class="obs-reg-detector-header">
            <span class="obs-reg-section-title">감지기</span>
            <div class="obs-reg-detector-btns">
              <button class="obs-reg-det-btn obs-reg-det-btn--add" id="btn-det-add" type="button">+</button>
              <button class="obs-reg-det-btn obs-reg-det-btn--remove" id="btn-det-remove" type="button">−</button>
            </div>
          </div>
          <div class="obs-reg-det-table-wrap">
            <table class="obs-reg-det-table">
              <colgroup>
                <col style="width: 52%" />
                <col style="width: 48%" />
              </colgroup>
              <thead>
                <tr>
                  <th>발신기명</th>
                  <th>감도세기</th>
                </tr>
              </thead>
              <tbody id="det-list">
                <tr class="det-row">
                  <td>
                    <input class="obs-reg-input obs-reg-input--det det-name-input" type="text" placeholder="직접 입력" />
                  </td>
                  <td>
                    <select class="obs-reg-select obs-reg-select--det det-strength-select">
                      <option value="">-- 선택 --</option>
                      <option value="미약">미약</option>
                      <option value="감1">감1</option>
                      <option value="감2">감2</option>
                      <option value="감3">감3</option>
                      <option value="P1">P1</option>
                      <option value="P2">P2</option>
                      <option value="P3">P3</option>
                      <option value="P4">P4</option>
                      <option value="P5">P5</option>
                      <option value="P6">P6</option>
                      <option value="P7">P7</option>
                      <option value="P8">P8</option>
                      <option value="P9">P9</option>
                      <option value="P10">P10</option>
                    </select>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- 등록 / 취소 버튼 -->
        <div class="obs-reg-footer">
          <button class="obs-reg-btn obs-reg-btn--submit" id="btn-reg-submit" type="button">등록</button>
          <button class="obs-reg-btn obs-reg-btn--cancel" id="btn-reg-cancel" type="button">취소</button>
        </div>

      </form>
    </div>
  </div>

  <!-- 하단 좌측 패널 -->
  <div class="panel-stack panel-bottom-left">
    <div class="panel-tabs panel-tabs-floating">
      <button class="tab-btn tab-active" id="btn-obs-list" type="button">관측점 목록</button>
      <button class="tab-btn list-toggle list-toggle--local" id="btn-realtime-list" type="button" aria-label="로컬 목록에서 실시간 목록으로 전환" aria-pressed="false">
        <span class="list-toggle__label list-toggle__label--left">로컬</span>
        <span class="list-toggle__track" aria-hidden="true"><span class="list-toggle__thumb"></span></span>
        <span class="list-toggle__label list-toggle__label--right">실시간</span>
      </button>
    </div>

    <div class="panel" id="panel">
      <div class="panel-header">
        <div id="status"></div>
        <button class="panel-toggle" id="btn-panel-toggle" aria-expanded="true">▼</button>
      </div>

      <div class="panel-body" id="panel-body">
        <div class="bears-box" id="bears-box">
          <div class="bears-title">
            <span>곰 추적위치 목록</span>
            <div class="bears-toolbar" id="bears-toolbar">
              <div class="bears-toolbar__row bears-toolbar__row--top">
                <span class="bears-toolbar__summary" id="bears-toolbar-summary" aria-live="polite" hidden></span>
                <div class="bears-toolbar__top-actions">
                  <button class="bears-toolbar-btn bears-toolbar-btn--ghost bears-toolbar-btn--excel-all" id="btn-bears-download-all-xls" type="button" aria-label="엑셀 일괄 다운로드" disabled>
                    <span class="bears-toolbar-btn__excel-icon" aria-hidden="true"></span>
                    <span>일괄 다운로드</span>
                  </button>
                  <button class="bears-toolbar-btn bears-toolbar-btn--ghost bears-toolbar-btn--realtime-upload" id="btn-bears-upload-selected" type="button" aria-label="실시간 선택 업로드" disabled>
                    <span class="bears-toolbar-btn__upload-icon" aria-hidden="true"></span>
                    <span>선택 업로드</span>
                  </button>
                </div>
              </div>
              <div class="bears-toolbar__row bears-toolbar__row--bottom">
                <label class="bears-select-all" for="bears-select-all">
                  <input type="checkbox" id="bears-select-all" />
                  <span>일괄 선택</span>
                </label>
                <div class="bears-toolbar__actions" id="bears-toolbar-actions">
                  <span class="bears-selection-count" id="bears-selection-count">0개 선택</span>
                  <button class="bears-toolbar-btn bears-toolbar-btn--danger" id="btn-bears-delete-selected" type="button" disabled>선택 삭제</button>
                </div>
              </div>
            </div>
          </div>
          <div class="bears-list" id="bears-list">
            <div class="bears-empty" role="status" aria-live="polite">
              <div class="bears-empty__icon" aria-hidden="true">🐻</div>
              <div class="bears-empty__title">곰 추적위치 목록이 비어 있습니다</div>
              <div class="bears-empty__desc">관측점 위치분석 결과를 저장하면 목록이 표시됩니다.</div>
              <div class="bears-empty__hint">관측점 목록에서 2개 이상 선택 후 위치분석을 실행해보세요.</div>
              <button class="bears-empty__action" type="button">관측점 목록 열기</button>
            </div>
          </div>
        </div>

        <div class="realtime-box bears-box hidden" id="realtime-box" aria-label="실시간 목록 패널">
          <div class="bears-title">
            <span id="realtime-title-label">실시간 목록</span>
            <div class="bears-toolbar" id="realtime-toolbar">
              <div class="bears-toolbar__row bears-toolbar__row--top">
                <span class="bears-toolbar__summary" id="realtime-toolbar-summary" aria-live="polite">0건 표시됨</span>
                <div class="bears-toolbar__top-actions">
                  <button class="bears-toolbar-btn bears-toolbar-btn--ghost bears-toolbar-btn--excel-all" id="btn-realtime-download-selected-xls" type="button" aria-label="실시간 선택 엑셀 다운로드" disabled>
                    <span class="bears-toolbar-btn__excel-icon" aria-hidden="true"></span>
                    <span>일괄 다운로드</span>
                  </button>
                </div>
              </div>
              <div class="bears-toolbar__row bears-toolbar__row--bottom">
                <label class="bears-select-all" for="realtime-select-all">
                  <input type="checkbox" id="realtime-select-all" />
                  <span>일괄 선택</span>
                </label>
                <div class="bears-toolbar__actions" id="realtime-toolbar-actions">
                  <span class="bears-selection-count" id="realtime-selection-count">0개 선택</span>
                </div>
              </div>
            </div>
          </div>
          <div class="realtime-list bears-list" id="realtime-list">
            <div class="realtime-empty" id="realtime-empty" role="status" aria-live="polite">
              <div class="realtime-empty__title">아직 전송된 실시간 항목이 없습니다</div>
              <div class="realtime-empty__desc">곰 추적위치 목록에서 전송 버튼을 누르면 여기에 표시됩니다.</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 태블릿 가로 2단 사이드바 배경 (CSS 미디어쿼리로만 제어) -->
  <div id="bp-tablet-sidebar" aria-hidden="true"></div>
  <button id="btn-sidebar-toggle" type="button" aria-label="사이드바 접기" aria-expanded="true" title="사이드바 접기">◀</button>

  <div id="map"></div>
  <div id="compass">
    <div id="compass-needle">
      <span class="needle red"></span>
      <span class="needle blue"></span>
    </div>
  </div>

  <script src="vendor/ol/ol.js"></script>
  <script src="vendor/proj4.js"></script>
  <!-- SQLite 버전/마이그레이션 설정 -->
  <script src="js/db/sqlite-migrations.js"></script>
  <!-- SQLite 자산 복사/내부 연결 초기화 모듈 -->
  <script src="js/db/sqlite-init.js"></script>
  <script src="runtime-config.js"></script>
  <script src="js/analysis/bear-position-analysis.js"></script>
  <script src="js/realtime/realtimeList.js"></script>
  <script src="js/obs/obsList.js"></script>
  <script src="js/obs/obsRegister.js"></script>
  <script src="js/map/ol-map-controls.js"></script>
  <script src="js/client-ol.js"></script>
</body>
</html>
