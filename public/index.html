<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>지리산 곰 찾기</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/panel.css" />
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script defer src="/js/client.js"></script>
</head>
<body>
  <section class="obs-sheet hidden" id="obs-sheet" aria-label="관측점 목록 패널">
    <div class="obs-sheet-header">
      <h2>관측점 목록</h2>
      <button class="analysis-btn" id="btn-analysis" type="button">위치분석</button>
    </div>

    <div class="obs-table-wrap">
      <table class="obs-table">
        <thead>
          <tr>
            <th>관측점</th>
            <th>좌표</th>
            <th>곰 코드</th>
            <th>등록자</th>
            <th>관리</th>
          </tr>
        </thead>
        <tbody id="obs-list-body"></tbody>
      </table>
    </div>
  </section>

  <div class="panel-stack panel-bottom-left">
    <div class="panel-tabs panel-tabs-floating">
        <button class="tab-btn" id="btn-obs-add" disabled>관측점 등록</button>
        <button class="tab-btn" id="btn-obs-list">관측점 목록</button>
    </div>

    <div class="panel" id="panel">
      <div class="panel-header">
        <div id="status">연결됨</div>
        <button class="panel-toggle" id="btn-panel-toggle" aria-expanded="true">▼</button>
      </div>

      <div class="panel-body" id="panel-body">
        <div class="bears-box" id="bears-box">
          <div class="bears-title">
            <span>곰 목록</span>
          </div>
          <div class="bears-list" id="bears-list">
            <div class="bears-empty">아직 목록이 없습니다.</div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="map"></div>
  <div id="compass">
  <div id="compass-needle">
    <span class="needle red"></span>
    <span class="needle blue"></span>
  </div>
</div>
  </div>
</body>
</html>
