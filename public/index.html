<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>지리산 반달곰 위치 분석</title>
  <script src="js/startup-diagnostics.js"></script>
  <script src="js/native-plugin-compat.js"></script>

  <link rel="stylesheet" href="vendor/ol/ol.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/panel.css" />
  <link rel="stylesheet" href="css/observation-sharing.css" />
  <link rel="stylesheet" href="css/sdr-diagnostics.css" />
  <link rel="stylesheet" href="css/app-settings.css" />
  <link rel="stylesheet" href="css/gps-tracking.css" />
  <link rel="stylesheet" href="css/mobile-map-dock.css" />
  <link rel="stylesheet" href="css/list-search.css" />
  <link rel="stylesheet" href="css/estimate-history.css" />
  <link rel="stylesheet" href="css/analysis-mobile-sheet.css" />
  <script src="js/analysis-mobile-sheet.js"></script>
  <script src="js/analysis/analysis-viewport.js"></script>
  <script src="js/analysis/press-repeat.js"></script>
</head>
<body>

  <!-- 관측점 목록 패널 -->
  <section class="obs-sheet hidden" id="obs-sheet" aria-label="관측점 목록 패널">
    <div class="obs-sheet-header">
      <h2>관측점 목록</h2>
      <div class="obs-header-actions">
        <button class="obs-header-add" id="btn-obs-add-inline" type="button">+ 등록</button>
        <button class="obs-header-refresh list-refresh-button" id="btn-obs-refresh" type="button" aria-label="공유 관측점 새로고침" title="공유 관측점 새로고침">↻</button>
        <button class="obs-panel-icon-btn" id="btn-obs-list-peek" type="button" aria-label="최소화" title="최소화"><img src="css/svg/peek-collapse-white.svg" alt="" aria-hidden="true" /></button>
        <button class="obs-sheet-close" id="btn-obs-list-close" type="button" aria-label="닫기">
          <img src="css/svg/close-white.svg" alt="" aria-hidden="true" />
        </button>
      </div>
    </div>

    <div class="obs-search-bar list-search-row">
      <input class="obs-search-input list-search-input" id="search-query" type="search" placeholder="관측점명·코드·담당자 검색" aria-label="관측점명, 개체 코드 또는 담당자 검색" autocomplete="off" spellcheck="false" enterkeyhint="search" />
      <button class="list-owner-shortcut" id="btn-obs-filter-mine" type="button" title="이 기기에서 마지막으로 등록할 때 입력한 담당자" aria-pressed="false" aria-label="내 담당자명으로 검색">MY</button>
      <button class="list-filter-button" id="btn-obs-filter" type="button" aria-expanded="false" aria-controls="obs-filter-panel">필터<span class="list-filter-count" id="obs-filter-count" hidden></span></button>
      <button class="obs-search-clear list-search-reset" id="btn-search-clear" type="button" disabled>초기화</button>
    </div>

    <section class="obs-filter-panel" id="obs-filter-panel" aria-label="관측점 상세 필터" hidden>
      <div class="obs-filter-body">
        <div class="list-filter-selects">
          <div class="obs-filter-field list-filter-team"><label for="obs-filter-team">팀</label><div class="obs-filter-control-row"><select id="obs-filter-team"><option value="">전체 팀</option></select></div></div>
          <div class="obs-filter-field list-filter-period"><label for="obs-filter-period">등록 기간</label><div class="obs-filter-control-row"><select id="obs-filter-period"><option value="all" selected>전체 기간</option><option value="day">일별</option><option value="month">월별</option><option value="year">년별</option><option value="range">기간 지정</option></select></div></div>
        </div>
        <div class="obs-filter-field list-filter-dates" id="obs-filter-dates" hidden>
          <label>날짜</label><div class="obs-filter-control-row">
            <input id="obs-filter-day" type="date" aria-label="등록일 선택" hidden />
            <input id="obs-filter-month" type="month" aria-label="등록월 선택" hidden />
            <input id="obs-filter-year" type="number" inputmode="numeric" min="1900" max="9999" step="1" aria-label="등록년도 입력" placeholder="예: 2026" hidden />
            <div class="list-filter-range" id="obs-filter-range" hidden><input id="obs-filter-start" type="date" aria-label="조회 시작일" /><span aria-hidden="true">~</span><input id="obs-filter-end" type="date" aria-label="조회 종료일" /></div>
          </div>
          <p class="obs-filter-error" id="obs-filter-error" role="status" hidden></p>
        </div>
      </div>
    </section>

    <div class="obs-list-status" id="obs-list-status" aria-live="polite" hidden>
      <div class="obs-overview">
        <div class="obs-overview-meta">
          <span class="obs-list-status__count" id="obs-list-count">0건</span>
          <button id="obs-filter-summary" class="obs-filter-summary" type="button" aria-controls="obs-filter-panel" aria-expanded="false" hidden></button>
        </div>
        <div class="obs-selection-actions" id="obs-selection-actions" hidden>
          <span class="sel-count-badge" id="obs-selected-count" hidden>0개 선택</span>
          <button class="analysis-btn" id="btn-analysis" type="button" hidden>위치분석</button>
          <button class="obs-inline-register-btn" id="btn-obs-send-selected" type="button" hidden>선택 공유</button>
          <button class="bulk-delete-btn bulk-delete-btn--inline" id="btn-delete-selected" type="button" hidden>삭제</button>
        </div>
      </div>
      <p class="obs-sync-note" id="obs-sync-note" hidden></p>
    </div>

    <div class="obs-table-wrap">
      <table class="obs-table">
        <thead>
          <tr>
            <th class="col-chk"><input type="checkbox" id="chk-all" title="전체선택" /></th>
            <th>관측점</th>
            <th>코드</th>
            <th>담당자</th>
            <th>팀명</th>
          </tr>
        </thead>
        <tbody id="obs-list-body"></tbody>
      </table>
    </div>
  </section>

  <!-- 관측점 등록 팝업 -->
  <div class="obs-register-popup hidden" id="register-box" aria-label="관측점 등록 팝업">
    <div class="obs-register-header">
      <h2>관측점 등록</h2>
      <div class="obs-register-header-actions">
        <button class="obs-panel-icon-btn" id="btn-register-peek" type="button" aria-label="최소화" title="최소화"><img src="css/svg/peek-collapse-white.svg" alt="" aria-hidden="true" /></button>
        <button class="obs-register-close" id="btn-register-close" type="button" aria-label="닫기">
          <img src="css/svg/close-white.svg" alt="" aria-hidden="true" />
        </button>
      </div>
    </div>
    <div class="obs-register-body">
      <form class="obs-reg-form" id="obs-reg-form" autocomplete="off" onsubmit="return false;">
        <p id="reg-sdr-source" class="obs-reg-sdr-source" role="status" hidden></p>

        <!-- 기본 정보 영역 -->
        <div class="obs-reg-section">

          <!-- 설정에서 가져온 고정 등록 정보 -->
          <div class="obs-reg-identity" role="group" aria-label="설정된 담당자와 팀" title="담당자·팀은 상단 설정에서 변경할 수 있습니다">
            <label class="obs-reg-identity-label" for="reg-owner">담당자</label>
            <textarea class="obs-reg-identity-owner" id="reg-owner" rows="1" maxlength="100" readonly aria-label="담당자" placeholder="담당자 입력"></textarea>
            <div class="obs-reg-identity-team"><label class="obs-reg-identity-label" for="reg-team">팀</label><div class="obs-reg-team-badge"><span class="obs-reg-team-dot" aria-hidden="true"></span><input class="obs-reg-identity-team-input" id="reg-team" type="text" readonly aria-label="소속 팀" placeholder="팀 선택" /><select id="reg-team-select" class="obs-reg-identity-team-input obs-reg-team-select" aria-label="소속 팀 선택" hidden><option value="">팀 선택</option></select></div></div>
          </div>

          <!-- 명칭 -->
          <div class="obs-reg-row">
            <label class="obs-reg-label" for="reg-place">명칭</label>
            <input class="obs-reg-input" id="reg-place" type="text" placeholder="명칭을 입력하세요" />
          </div>

          <div class="obs-reg-row">
            <label class="obs-reg-label" for="reg-admin-region">위치</label>
            <input class="obs-reg-input" id="reg-admin-region" type="text" placeholder="좌표 선택 시 자동 조회 · 직접 수정 가능" />
          </div>

          <!-- 좌표 -->
          <div class="obs-reg-row obs-reg-coordinate-row">
            <div class="obs-reg-coordinate-label">
              <label class="obs-reg-label" for="reg-coord">좌표</label>
              <div class="obs-reg-gps-toggle-row">
                <button class="obs-reg-gps-toggle" id="btn-gps-toggle" type="button" aria-pressed="false" aria-label="내 위치 사용" title="내 위치 켜기">
                  <span class="obs-reg-gps-toggle__knob" aria-hidden="true"></span>
                  <span class="obs-reg-gps-toggle__label">GPS OFF</span>
                </button>
              </div>
            </div>
            <input class="obs-reg-input obs-reg-input--gps" id="reg-coord" type="text" placeholder="GPS 대기중" readonly />
          </div>

          <!-- 방향각 -->
          <div class="obs-reg-row">
            <label class="obs-reg-label" for="reg-heading">방향각</label>
            <div class="obs-reg-heading-wrap">
              <input class="obs-reg-input obs-reg-input--gps obs-reg-input--heading" id="reg-heading" type="text" inputmode="decimal" placeholder="현재 GPS 값" readonly />
              <label class="obs-reg-lock-label" for="chk-reg-heading-lock">
                <input id="chk-reg-heading-lock" type="checkbox" /> 각 고정
              </label>
            </div>
          </div>

          <!-- 개체 번호 -->
          <div class="obs-reg-row">
            <label class="obs-reg-label" for="reg-bear">개체 번호</label>
            <div class="obs-reg-bear-control">
              <input class="obs-reg-input" id="reg-bear" type="text" placeholder="직접 입력 또는 찾기" />
              <button class="obs-reg-bear-find" id="btn-bear-find" type="button">찾기</button>
            </div>
          </div>

        </div>

        <!-- 감지기 영역 -->
        <div class="obs-reg-section obs-reg-section--detector">
          <div class="obs-reg-detector-header">
            <button class="obs-reg-det-toggle" id="btn-det-toggle" type="button" aria-expanded="false" aria-controls="det-fields"><span id="det-summary">감지기 0개</span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></button>
            <div class="obs-reg-detector-btns">
              <button class="obs-reg-det-btn obs-reg-det-btn--add" id="btn-det-add" type="button" aria-label="감지기 추가">+</button>
              <button class="obs-reg-det-btn obs-reg-det-btn--remove" id="btn-det-remove" type="button" aria-label="마지막 감지기 삭제">−</button>
            </div>
          </div>
          <div class="obs-reg-det-table-wrap" id="det-fields" hidden>
            <table class="obs-reg-det-table">
              <colgroup>
                <col style="width: 52%" />
                <col style="width: 48%" />
              </colgroup>
              <thead>
                <tr>
                  <th>발신기명</th>
                  <th>감도세기</th>
                </tr>
              </thead>
              <tbody id="det-list">
                <tr class="det-row">
                  <td>
                    <input class="obs-reg-input obs-reg-input--det det-name-input" type="text" placeholder="직접 입력" />
                  </td>
                  <td>
                    <select class="obs-reg-select obs-reg-select--det det-strength-select">
                      <option value="">-- 선택 --</option>
                      <option value="미약">미약</option>
                      <option value="감1">감1</option>
                      <option value="감2">감2</option>
                      <option value="감3">감3</option>
                      <option value="P1">P1</option>
                      <option value="P2">P2</option>
                      <option value="P3">P3</option>
                      <option value="P4">P4</option>
                      <option value="P5">P5</option>
                      <option value="P6">P6</option>
                      <option value="P7">P7</option>
                      <option value="P8">P8</option>
                      <option value="P9">P9</option>
                      <option value="P10">P10</option>
                    </select>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- 등록 / 취소 버튼 -->
        <div class="obs-reg-footer">
          <button class="obs-reg-btn obs-reg-btn--submit" id="btn-reg-submit" type="button">등록</button>
          <button class="obs-reg-btn obs-reg-btn--cancel" id="btn-reg-cancel" type="button">취소</button>
        </div>

      </form>
    </div>
  </div>

  <div class="bear-picker hidden" id="bear-picker" role="dialog" aria-modal="true" aria-labelledby="bear-picker-title">
    <div class="bear-picker__panel">
      <div class="bear-picker__header">
        <h2 id="bear-picker-title">곰 개체 찾기</h2>
        <button class="bear-picker__close" id="bear-picker-close" type="button" aria-label="닫기">×</button>
      </div>
      <div class="bear-picker__body">
        <input class="bear-picker__search" id="bear-picker-search" type="search" placeholder="개체번호 검색" aria-label="개체번호 검색" />
        <div class="bear-picker__count" id="bear-picker-count" aria-live="polite"></div>
        <div class="bear-picker__sort" role="group" aria-label="개체 목록 정렬">
          <button type="button" data-bear-sort="bearCode">개체번호 <span class="bear-picker__sort-arrow" aria-hidden="true"></span></button>
          <button type="button" data-bear-sort="sex">성별 <span class="bear-picker__sort-arrow" aria-hidden="true"></span></button>
          <button type="button" data-bear-sort="birthYear">출생연도 <span class="bear-picker__sort-arrow" aria-hidden="true"></span></button>
        </div>
        <div class="bear-picker__list" id="bear-picker-list" role="listbox" aria-label="곰 개체 목록"></div>
      </div>
      <div class="bear-picker__footer">
        <button class="bear-picker__confirm" id="bear-picker-confirm" type="button" disabled>선택 확인</button>
        <button class="bear-picker__cancel" id="bear-picker-cancel" type="button">취소</button>
      </div>
    </div>
  </div>

  <!-- 하단 좌측 패널 -->
  <div class="panel-stack panel-bottom-left">
    <div class="panel-tabs panel-tabs-floating">
      <button class="tab-btn tab-active" id="btn-obs-list" type="button">관측점 목록</button>
      <button class="tab-btn" id="btn-gps-tracking" type="button" aria-expanded="false">이동 기록</button>
    </div>

    <div class="panel" id="panel">
      <div class="panel-header">
        <div id="status"></div>
        <button class="panel-toggle" id="btn-panel-toggle" aria-expanded="true">▼</button>
      </div>

      <div class="panel-body" id="panel-body">
        <div class="tracking-source-heading"><span>개체 추적</span><button class="tracking-refresh list-refresh-button" id="btn-bears-refresh" type="button" title="공유 자료 새로고침" aria-label="개체 추적위치 새로고침">↻</button></div>
        <form class="bear-code-search gps-history-search-row list-search-row" id="bear-code-search-form" role="search" aria-label="개체 추적 검색">
          <input class="list-search-input" id="bear-code-query" type="search" placeholder="개체 코드·담당자 검색" aria-label="개체 코드 또는 담당자 검색" autocomplete="off" spellcheck="false" enterkeyhint="search" />
          <button type="button" class="list-owner-shortcut" id="btn-bear-filter-mine" aria-pressed="false" disabled aria-label="내 담당자명으로 검색">MY</button>
          <button type="button" class="list-filter-button" id="btn-bear-filter" aria-expanded="false" aria-controls="bear-filter-panel">필터<span class="list-filter-count" id="bear-filter-count" hidden></span></button>
          <button type="button" class="list-search-reset" id="btn-bear-code-clear" disabled>초기화</button>
        </form>
        <section class="gps-history-filters bear-estimate-filters" id="bear-filter-panel" aria-label="개체 추적 상세 필터" hidden>
          <div class="list-filter-selects">
            <div class="obs-filter-field list-filter-team"><label for="bear-filter-team">팀</label><div class="obs-filter-control-row"><select id="bear-filter-team"><option value="">전체 팀</option></select></div></div>
            <div class="obs-filter-field list-filter-period"><label for="bear-filter-period">등록 기간</label><div class="obs-filter-control-row"><select id="bear-filter-period"><option value="all" selected>전체 기간</option><option value="day">일별</option><option value="month">월별</option><option value="year">년별</option><option value="range">기간 지정</option></select></div></div>
          </div>
          <div class="obs-filter-field list-filter-dates" id="bear-filter-dates" hidden>
            <label>날짜</label><div class="obs-filter-control-row">
              <input id="bear-filter-day" type="date" aria-label="등록일 선택" hidden />
              <input id="bear-filter-month" type="month" aria-label="등록월 선택" hidden />
              <input id="bear-filter-year" type="number" inputmode="numeric" min="1900" max="9999" step="1" aria-label="등록년도 입력" placeholder="예: 2026" hidden />
            <div class="list-filter-range" id="bear-filter-range" hidden><input id="bear-filter-start" type="date" aria-label="조회 시작일" /><span aria-hidden="true">~</span><input id="bear-filter-end" type="date" aria-label="조회 종료일" /></div>
            </div>
            <p class="obs-filter-error" id="bear-filter-error" role="status" hidden></p>
          </div>
        </section>
        <div class="bears-box" id="bears-box">
          <div class="bears-title">
            <div class="bears-toolbar" id="bears-toolbar">
              <div class="bears-toolbar__row bears-toolbar__row--top">
                <span class="bears-toolbar__summary" id="bears-toolbar-summary" aria-live="polite" hidden></span>
                <div class="bears-toolbar__top-actions">
                  <button class="bears-toolbar-btn bears-toolbar-btn--ghost bears-toolbar-btn--excel-all" id="btn-bears-download-all-xls" type="button" aria-label="엑셀 일괄 다운로드" disabled>
                    <span class="bears-toolbar-btn__excel-icon" aria-hidden="true"></span>
                    <span>일괄 다운로드</span>
                  </button>
                  <button class="bears-toolbar-btn bears-toolbar-btn--ghost bears-toolbar-btn--realtime-upload" id="btn-bears-upload-selected" type="button" aria-label="선택한 미공유 추적위치 공유" disabled>
                    <span class="bears-toolbar-btn__upload-icon" aria-hidden="true"></span>
                    <span>선택 공유</span>
                  </button>
                </div>
              </div>
              <div class="bears-toolbar__row bears-toolbar__row--bottom">
                <label class="bears-select-all" for="bears-select-all">
                  <input type="checkbox" id="bears-select-all" />
                  <span>일괄 선택</span>
                </label>
                <div class="bears-toolbar__actions" id="bears-toolbar-actions">
                  <span class="bears-selection-count" id="bears-selection-count">0개 선택</span>
                  <button class="bears-toolbar-btn bears-toolbar-btn--danger" id="btn-bears-delete-unshared" type="button" hidden disabled>선택 삭제</button>
                </div>
              </div>
            </div>
          </div>
          <div class="bears-list" id="bears-list">
            <div class="bears-empty" role="status" aria-live="polite">
              <div class="bears-empty__icon" aria-hidden="true">🐻</div>
              <div class="bears-empty__title">곰 추적위치 목록이 비어 있습니다</div>
              <div class="bears-empty__desc">관측점 위치분석 결과를 저장하면 목록이 표시됩니다.</div>
              <div class="bears-empty__hint">관측점 목록에서 2개 이상 선택 후 위치분석을 실행해보세요.</div>
              <button class="bears-empty__action" type="button">관측점 목록 열기</button>
            </div>
          </div>
        </div>

        <div class="realtime-box bears-box hidden" id="realtime-box" aria-label="실시간 목록 패널">
          <div class="bears-title">
            <span id="realtime-title-label">실시간 목록</span>
            <div class="bears-toolbar" id="realtime-toolbar">
              <div class="bears-toolbar__row bears-toolbar__row--top">
                <span class="bears-toolbar__summary" id="realtime-toolbar-summary" aria-live="polite">0건 표시됨</span>
                <div class="bears-toolbar__top-actions">
                  <button class="bears-toolbar-btn bears-toolbar-btn--ghost bears-toolbar-btn--excel-all" id="btn-realtime-download-selected-xls" type="button" aria-label="실시간 선택 엑셀 다운로드" disabled>
                    <span class="bears-toolbar-btn__excel-icon" aria-hidden="true"></span>
                    <span>일괄 다운로드</span>
                  </button>
                </div>
              </div>
              <div class="bears-toolbar__row bears-toolbar__row--bottom">
                <label class="bears-select-all" for="realtime-select-all">
                  <input type="checkbox" id="realtime-select-all" />
