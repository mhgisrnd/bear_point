<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>지리산 곰 위치추적 - 로그인</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-forest: #1f3c34;
      --bg-mist: #e9efe7;
      --card: #f8fbf7;
      --ink: #12201b;
      --muted: #607066;
      --accent: #3f6b3f;
      --accent-strong: #2e5230;
      --danger: #b0392f;
      --ring: rgba(63, 107, 63, 0.28);
      --shadow: 0 22px 60px rgba(18, 32, 27, 0.2);
      --radius-lg: 22px;
      --radius-md: 14px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: "Noto Sans KR", sans-serif;
      color: var(--ink);
      background: radial-gradient(1200px 700px at 85% -20%, rgba(230, 238, 228, 0.95) 0%, transparent 65%),
                  radial-gradient(900px 620px at -10% 100%, rgba(95, 132, 94, 0.22) 0%, transparent 65%),
                  linear-gradient(150deg, #dfe8db 0%, #eef3ea 52%, #f7faf4 100%);
      overflow-x: hidden;
    }

    .scene {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 16px;
      position: relative;
      isolation: isolate;
    }

    .scene::before,
    .scene::after {
      content: "";
      position: absolute;
      z-index: -1;
      border-radius: 999px;
      filter: blur(2px);
      opacity: 0.7;
    }

    .scene::before {
      width: 320px;
      height: 320px;
      background: linear-gradient(145deg, rgba(93, 128, 95, 0.25), rgba(69, 98, 66, 0.08));
      top: 7%;
      left: 7%;
      animation: driftA 11s ease-in-out infinite;
    }

    .scene::after {
      width: 260px;
      height: 260px;
      background: linear-gradient(145deg, rgba(218, 229, 214, 0.78), rgba(170, 192, 166, 0.2));
      bottom: 8%;
      right: 8%;
      animation: driftB 13s ease-in-out infinite;
    }

    .login-wrap {
      width: min(100%, 980px);
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      background: var(--card);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      overflow: hidden;
      transform: translateY(10px);
      opacity: 0;
      animation: cardIn 0.8s ease-out forwards;
    }

    .hero {
      position: relative;
      padding: 46px 38px 38px;
      background: linear-gradient(160deg, #31543b 0%, #274632 40%, #203a2a 100%);
      color: #f2f7f0;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: repeating-linear-gradient(
        -22deg,
        rgba(255, 255, 255, 0.04) 0,
        rgba(255, 255, 255, 0.04) 12px,
        transparent 12px,
        transparent 26px
      );
      pointer-events: none;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      margin-bottom: 18px;
    }

    .eyebrow .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #b5dda3;
      box-shadow: 0 0 0 6px rgba(181, 221, 163, 0.18);
    }

    .hero h1 {
      margin: 0;
      line-height: 1.12;
      font-family: "Black Han Sans", sans-serif;
      font-size: clamp(34px, 4vw, 48px);
      letter-spacing: -0.02em;
    }

    .hero p {
      margin: 16px 0 0;
      max-width: 30ch;
      color: rgba(242, 247, 240, 0.9);
      line-height: 1.62;
      font-size: 15px;
    }

    .hero-footer {
      margin-top: 28px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: rgba(242, 247, 240, 0.86);
      font-size: 14px;
    }

    .hero-footer img {
      width: 36px;
      height: 36px;
      object-fit: contain;
      filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.22));
    }

    .form-panel {
      padding: 40px 34px 34px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 16px;
      background: linear-gradient(180deg, #fbfdf9 0%, #f2f8f0 100%);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 2px;
    }

    .brand img {
      width: 44px;
      height: 44px;
      object-fit: contain;
      border-radius: 10px;
      background: #ffffff;
      padding: 5px;
      box-shadow: 0 8px 18px rgba(18, 32, 27, 0.16);
    }

    .brand h2 {
      margin: 0;
      font-size: 20px;
      letter-spacing: -0.01em;
    }

    .sub {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    form {
      margin-top: 8px;
      display: grid;
      gap: 12px;
    }

    label {
      display: grid;
      gap: 7px;
      font-size: 13px;
      font-weight: 700;
      color: #294136;
    }

    input {
      width: 100%;
      height: 48px;
      border-radius: var(--radius-md);
      border: 1px solid #d4dfd0;
      background: #ffffff;
      color: var(--ink);
      padding: 0 14px;
      font-size: 15px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }

    input::placeholder {
      color: #9aaba1;
    }

    input:focus {
      outline: none;
      border-color: #6a9a67;
      box-shadow: 0 0 0 4px var(--ring);
      transform: translateY(-1px);
    }

    .password-wrap {
      position: relative;
    }

    .toggle-visibility {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      border-radius: 9px;
      background: #eef4ea;
      color: #3a523f;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 8px;
      cursor: pointer;
    }

    .toggle-visibility:hover {
      background: #e4eddf;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 2px;
      font-size: 13px;
    }

    .check {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #385344;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
    }

    .check input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: var(--accent);
      box-shadow: none;
      transform: none;
    }

    .link {
      color: #355f3f;
      font-weight: 700;
      text-decoration: none;
    }

    .link:hover {
      text-decoration: underline;
    }

    .btn-login {
      margin-top: 4px;
      width: 100%;
      height: 50px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(130deg, var(--accent) 0%, var(--accent-strong) 100%);
      color: #f7fff6;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: transform 0.22s ease, box-shadow 0.22s ease, filter 0.22s ease;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 20px rgba(47, 82, 48, 0.26);
      filter: saturate(1.05);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .notice {
      min-height: 18px;
      margin: 2px 0 0;
      font-size: 12px;
      color: var(--danger);
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .notice.show {
      opacity: 1;
    }

    .footer-text {
      margin: 4px 0 0;
      color: #6c7a72;
      font-size: 12px;
      text-align: center;
    }

    @keyframes cardIn {
      from {
        transform: translateY(12px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @keyframes driftA {
      0%,
      100% {
        transform: translate(0, 0);
      }
      50% {
        transform: translate(6px, -10px);
      }
    }

    @keyframes driftB {
      0%,
      100% {
        transform: translate(0, 0);
      }
      50% {
        transform: translate(-8px, 9px);
      }
    }

    @media (max-width: 900px) {
      .login-wrap {
        grid-template-columns: 1fr;
        width: min(100%, 560px);
      }

      .hero {
        padding: 36px 26px 28px;
      }

      .form-panel {
        padding: 28px 24px 24px;
      }

      .hero h1 {
        font-size: clamp(30px, 8.5vw, 42px);
      }
    }

    @media (max-width: 430px) {
      .scene {
        padding: 16px 10px;
      }

      .hero {
        padding: 28px 18px 24px;
      }

      .form-panel {
        padding: 22px 16px 20px;
      }

      .row {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <main class="scene">
    <section class="login-wrap" aria-label="지리산 곰 위치추적 로그인">
      <aside class="hero">
        <div class="eyebrow"><span class="dot" aria-hidden="true"></span> Tracking Secure Zone</div>
        <h1>지리산 곰 위치추적</h1>
        <p>
          시스템에 접속해 곰 위치 신호를 확인하세요.
          계정 인증 후 실시간 추적 화면으로 이동합니다.
        </p>
        <!-- <div class="hero-footer">
          <img src="/assets/icons/icon_bear.png" alt="곰 아이콘" />
          <span>Jirisan Wildlife Monitoring</span>
        </div> -->
      </aside>

      <div class="form-panel">
        <div class="brand">
          <img src="/assets/icons/icon_bear.png" alt="브랜드 곰 아이콘" />
          <h2>로그인</h2>
        </div>
        <p class="sub">관제 권한이 있는 계정으로 접속해 주세요.</p>

        <form id="loginForm" novalidate>
          <label for="userId">
            아이디
            <input id="userId" name="userId" type="text" autocomplete="username" placeholder="아이디 입력" required />
          </label>

          <label for="password">
            비밀번호
            <div class="password-wrap">
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="비밀번호 입력" required />
              <button class="toggle-visibility" type="button" id="togglePwd" aria-label="비밀번호 보기 전환">보기</button>
            </div>
          </label>

          <!-- <div class="row">
            <label class="check" for="rememberMe">
              <input id="rememberMe" type="checkbox" />
              로그인 상태 유지
            </label>
            <a class="link" href="#" aria-label="비밀번호 찾기">비밀번호 찾기</a>
          </div> -->

          <button class="btn-login" type="submit">로그인</button>
          <p class="notice" id="notice" role="alert" aria-live="polite"></p>
          <p class="footer-text"><a class="link" href="/admin/login">관리자 로그인 페이지로 이동</a></p>
          <p class="footer-text">테스트 화면입니다. 실제 인증 연동 전 UI 확인용입니다.</p>
        </form>
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById("loginForm");
    const notice = document.getElementById("notice");
    const togglePwd = document.getElementById("togglePwd");
    const passwordInput = document.getElementById("password");

    togglePwd.addEventListener("click", () => {
      const isPassword = passwordInput.type === "password";
      passwordInput.type = isPassword ? "text" : "password";
      togglePwd.textContent = isPassword ? "숨김" : "보기";
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const userId = form.userId.value.trim();
      const pwd = form.password.value.trim();

      if (!userId || !pwd) {
        notice.textContent = "아이디와 비밀번호를 모두 입력해 주세요.";
        notice.classList.add("show");
        return;
      }

      notice.classList.remove("show");
      alert("로그인 성공 예시입니다. 실제 인증 API와 연결해 주세요.");
    });
  </script>
</body>
</html>
