<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>지리산 곰 위치추적 - 관리자 대시보드</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../vendor/ol/ol.css" />
  <link rel="stylesheet" href="../css/admin-layout.css" />
  <link rel="stylesheet" href="../css/admin-dashboard.css" />
</head>
<body data-admin-page="dashboard" data-admin-title="관리자 대시보드" data-admin-subtitle="곰 개체 추적 현황과 경보를 한 눈에 보는 관리 첫 화면">
  <div class="admin-app">
    <main class="admin-shell">
      <aside class="admin-sidebar" id="adminSidebar"></aside>

      <div class="admin-main">
        <header class="admin-header" id="adminHeader"></header>

        <section class="dashboard-shell">
        <section class="dashboard-page-head" aria-label="페이지 제목">
          <p class="dashboard-page-kicker">Admin Workspace</p>
          <h1 id="adminHeaderTitle">관리자 대시보드</h1>
          <p class="dashboard-page-subtitle" id="adminHeaderSubtitle">곰 개체 추적 현황과 경보를 한 눈에 보는 관리 첫 화면</p>
        </section>

        <section class="stats-grid" aria-label="핵심 통계">
      <article class="stat-card accent-blue">
        <p class="stat-label">등록 개체수</p>
        <strong class="stat-value">145 마리</strong>
        <span class="stat-foot">관측 대상 등록 기준</span>
      </article>
      <article class="stat-card accent-green">
        <p class="stat-label">활성 추적 개체</p>
        <strong class="stat-value">13 마리</strong>
        <span class="stat-foot">전체 추적위치 건수</span>
      </article>
      <article class="stat-card accent-amber">
        <p class="stat-label">금일 등록건수</p>
        <strong class="stat-value">2 건</strong>
        <span class="stat-foot">추적위치 금일 등록 건수</span>
      </article>
      <article class="stat-card accent-slate">
        <p class="stat-label">금일 접속 건수</p>
        <strong class="stat-value">준비중</strong>
        <span class="stat-foot">금일 모바일 접속 건수</span>
      </article>
        </section>

        <section class="content-grid">
      <article class="map-panel">
        <div class="panel-head">
          <div>
            <p class="panel-kicker">Population Map</p>
            <h3>실시간 추적위치 조회</h3>
          </div>
          <button class="ghost-button" type="button" id="btnDashboardRealtimeRefresh">실시간 새로고침</button>
        </div>

        <div class="map-stage map-stage--realtime" aria-label="실시간 추적위치 조회 화면">
          <div class="admin-realtime-map" id="adminRealtimeMap"></div>
          <div class="admin-realtime-map-empty" id="adminRealtimeMapEmpty" hidden>실시간 좌표 데이터가 없습니다.</div>
        </div>
        <!-- <div class="map-legend">
          <span><i class="legend-dot live"></i>실시간 수신 위치</span>
          <span><i class="legend-dot stable"></i>최근 등록 좌표</span>
        </div> -->
      </article>

      <aside class="side-stack">
        <article class="side-card">
          <div class="panel-head compact">
            <div>
              <p class="panel-kicker">최근 추적위치 목록</p>
              <!-- <h3>최근 등록 건수</h3> -->
            </div>
            <!-- <span class="panel-badge">최대 10건</span> -->
            <span class="stat-foot">최근기준 10건까지 확인 가능합니다.</span> 
          </div>
          <ul class="recent-registration-list" id="recentRegistrationList" aria-label="최근 등록 건수 10건">
            <li><span>로딩 중...</span><strong>-</strong></li>
          </ul>
        </article>
      </aside>
        </section>
      </div>
    </main>

    <footer class="admin-footer" id="adminFooter"></footer>
  </div>

  <script src="../vendor/ol/ol.js"></script>
  <script src="../js/admin/admin-layout.js"></script>
  <script src="../js/admin/admin-dashboard.js"></script>
</body>
</html>
