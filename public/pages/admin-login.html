<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>지리산 곰 위치추적 - 관리자 로그인</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --ink: #172033;
      --muted: #5e697f;
      --accent: #1d4ed8;
      --accent-strong: #1e40af;
      --danger: #bf123f;
      --ring: rgba(29, 78, 216, 0.25);
      --shadow: 0 24px 54px rgba(23, 32, 51, 0.18);
      --radius-lg: 22px;
      --radius-md: 12px;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: "Noto Sans KR", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(980px 560px at 88% -10%, rgba(115, 157, 255, 0.25) 0%, transparent 62%),
        radial-gradient(860px 620px at -15% 95%, rgba(180, 196, 233, 0.36) 0%, transparent 66%),
        linear-gradient(160deg, #edf2fb 0%, #f7f9fe 55%, #fbfcff 100%);
    }

    .scene {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 14px;
    }

    .wrap {
      width: min(100%, 980px);
      display: grid;
      grid-template-columns: 1.08fr 0.92fr;
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow);
      background: var(--card);
    }

    .hero {
      padding: 42px 36px;
      color: #eff5ff;
      background: linear-gradient(160deg, #1e3a8a 0%, #1d4ed8 45%, #2563eb 100%);
      position: relative;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: repeating-linear-gradient(
        -24deg,
        rgba(255, 255, 255, 0.05) 0,
        rgba(255, 255, 255, 0.05) 14px,
        transparent 14px,
        transparent 30px
      );
      pointer-events: none;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.16);
      margin-bottom: 18px;
    }

    .badge .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f8c964;
      box-shadow: 0 0 0 5px rgba(248, 201, 100, 0.18);
    }

    .hero h1 {
      margin: 0;
      line-height: 1.12;
      /* font-family: "Black Han Sans", sans-serif; */
      font-size: clamp(32px, 4vw, 46px);
      letter-spacing: -0.02em;
    }

    .hero p {
      margin: 14px 0 0;
      max-width: 31ch;
      line-height: 1.62;
      color: rgba(239, 245, 255, 0.92);
      font-size: 15px;
    }

    .panel {
      padding: 34px 30px 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 14px;
      background: linear-gradient(180deg, #ffffff 0%, #f4f7ff 100%);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 2px;
    }

    .brand img {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: #fff;
      object-fit: contain;
      padding: 4px;
      box-shadow: 0 8px 16px rgba(23, 32, 51, 0.14);
    }

    .brand h2 {
      margin: 0;
      font-size: 21px;
      letter-spacing: -0.01em;
    }

    .sub {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    form {
      margin-top: 8px;
      display: grid;
      gap: 11px;
    }

    label {
      display: grid;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      color: #2b3d69;
    }

    input {
      width: 100%;
      height: 46px;
      border-radius: var(--radius-md);
      border: 1px solid #d5dff6;
      padding: 0 13px;
      font-size: 15px;
      color: var(--ink);
      background: #fff;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 4px var(--ring);
    }

    .password-wrap { position: relative; }

    .toggle-visibility {
      position: absolute;
      right: 9px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      border-radius: 9px;
      background: #edf3ff;
      color: #29488c;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 8px;
      cursor: pointer;
    }

    .btn-login {
      margin-top: 4px;
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 13px;
      background: linear-gradient(130deg, var(--accent), var(--accent-strong));
      color: #f8fbff;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 22px rgba(30, 64, 175, 0.28);
    }

    .notice {
      min-height: 18px;
      margin: 2px 0 0;
      color: var(--danger);
      font-size: 12px;
      font-weight: 700;
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .notice.show { opacity: 1; }

    .foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 2px;
      font-size: 12px;
      color: #67718a;
    }

    .foot a {
      color: #3157b5;
      text-decoration: none;
      font-weight: 700;
    }

    .foot a:hover { text-decoration: underline; }

    @media (max-width: 900px) {
      .wrap {
        grid-template-columns: 1fr;
        width: min(100%, 560px);
      }

      .hero { padding: 34px 24px 24px; }
      .panel { padding: 26px 20px 22px; }
      .hero h1 { font-size: clamp(30px, 9vw, 42px); }
    }
  </style>
</head>
<body>
  <main class="scene">
    <section class="wrap" aria-label="관리자 로그인">
      <aside class="hero">
        <div class="badge"><span class="dot" aria-hidden="true"></span>Admin Only</div>
        <h1>관리자 콘솔 로그인</h1>
        <p>
          관측점 등록, 수정, 삭제 기능은 관리자 계정으로만 접근 가능합니다.
          보안 인증 후 관리 콘솔로 이동합니다.
        </p>
      </aside>

      <div class="panel">
        <div class="brand">
          <img src="/assets/icons/icon_bear.png" alt="브랜드 아이콘" />
          <h2>관리자 로그인</h2>
        </div>
        <p class="sub">관리자 권한 계정을 입력해 주세요.</p>

        <form id="adminLoginForm" novalidate>
          <label for="adminId">
            관리자 아이디
            <input id="adminId" name="adminId" type="text" autocomplete="username" placeholder="admin id" required />
          </label>

          <label for="adminPassword">
            비밀번호
            <div class="password-wrap">
              <input id="adminPassword" name="adminPassword" type="password" autocomplete="current-password" placeholder="password" required />
              <button class="toggle-visibility" type="button" id="togglePwd" aria-label="비밀번호 보기 전환">보기</button>
            </div>
          </label>

          <button class="btn-login" type="submit">관리자 로그인</button>
          <p class="notice" id="notice" role="alert" aria-live="polite"></p>

          <div class="foot">
            <span>테스트 UI 페이지입니다.</span>
            <a href="/login">일반 로그인으로 이동</a>
          </div>
        </form>
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById("adminLoginForm");
    const notice = document.getElementById("notice");
    const togglePwd = document.getElementById("togglePwd");
    const passwordInput = document.getElementById("adminPassword");

    togglePwd.addEventListener("click", () => {
      const isPassword = passwordInput.type === "password";
      passwordInput.type = isPassword ? "text" : "password";
      togglePwd.textContent = isPassword ? "숨김" : "보기";
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const adminId = form.adminId.value.trim();
      const password = form.adminPassword.value.trim();

      if (!adminId || !password) {
        notice.textContent = "관리자 아이디와 비밀번호를 입력해 주세요.";
        notice.classList.add("show");
        return;
      }

      notice.classList.remove("show");
      alert("관리자 로그인 UI 확인용입니다. 실제 인증 API를 연결해 주세요.");
    });
  </script>
</body>
</html>
