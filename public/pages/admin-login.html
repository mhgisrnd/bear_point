<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>지리산 곰 위치추적 - 관리자 로그인</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/admin-login.css" />
</head>
<body>
  <main class="scene">
    <section class="wrap" aria-label="관리자 로그인">
      <aside class="hero">
        <div class="badge"><span class="dot" aria-hidden="true"></span>Admin Only</div>
        <h1>관리자 콘솔 로그인</h1>
        <p>
          관측점 등록, 수정, 삭제 기능은 관리자 계정으로만 접근 가능합니다.
          보안 인증 후 관리 콘솔로 이동합니다.
        </p>
      </aside>

      <div class="panel">
        <div class="brand">
          <img src="../assets/icons/icon_bear_real.png" alt="브랜드 아이콘" />
          <h2>관리자 로그인</h2>
        </div>
        <p class="sub">관리자 권한 계정을 입력해 주세요.</p>

        <form id="adminLoginForm" novalidate>
          <label for="adminId">
            관리자 아이디
            <input id="adminId" name="adminId" type="text" autocomplete="username" placeholder="admin id" required />
          </label>

          <label for="adminPassword">
            비밀번호
            <div class="password-wrap">
              <input id="adminPassword" name="adminPassword" type="password" autocomplete="current-password" placeholder="password" required />
              <button class="toggle-visibility" type="button" id="togglePwd" aria-label="비밀번호 보기 전환">보기</button>
            </div>
          </label>

          <button class="btn-login" type="submit">관리자 로그인</button>
          <p class="notice" id="notice" role="alert" aria-live="polite"></p>

          <div class="foot">
            <span>테스트 UI 페이지입니다.</span>
            <a href="login.html">일반 로그인으로 이동</a>
          </div>
        </form>
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById("adminLoginForm");
    const notice = document.getElementById("notice");
    const togglePwd = document.getElementById("togglePwd");
    const passwordInput = document.getElementById("adminPassword");

    togglePwd.addEventListener("click", () => {
      const isPassword = passwordInput.type === "password";
      passwordInput.type = isPassword ? "text" : "password";
      togglePwd.textContent = isPassword ? "숨김" : "보기";
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const adminId = form.adminId.value.trim();
      const password = form.adminPassword.value.trim();

      if (!adminId || !password) {
        notice.textContent = "관리자 아이디와 비밀번호를 입력해 주세요.";
        notice.classList.add("show");
        return;
      }

      notice.classList.remove("show");
      alert("관리자 로그인 UI 확인용입니다. 실제 인증 API를 연결해 주세요.");
    });
  </script>
</body>
</html>
